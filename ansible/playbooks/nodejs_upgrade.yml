
---
- name: Upgrade Node.js to version 22
  hosts: web
  become: yes

  tasks:
    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download NodeSource signing key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: '0644'

    - name: Add NodeSource Node.js 22 repository
      ansible.builtin.deb822_repository:
        name: nodesource
        types:
          - deb
        uris:
          - https://deb.nodesource.com/node_22.x
        suites:
          - nodistro
        components:
          - main
        signed_by: /etc/apt/keyrings/nodesource.asc
        state: present

    - name: Install Node.js 22
      ansible.builtin.apt:
        name: nodejs
        state: latest
        update_cache: yes
